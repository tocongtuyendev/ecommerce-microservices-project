
# Tên của ứng dụng, phải khớp với tên file cấu hình trong Git (product-service.properties)
spring.application.name=product-service

# Địa chỉ của Config Server
spring.config.import=optional:configserver:http://localhost:8888

# Thuộc tính này cần thiết cho Spring Boot 2.4+ khi dùng config server
spring.main.allow-bean-definition-overriding=true
